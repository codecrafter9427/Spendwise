services:
  postgres:
    image: postgres:16-alpine
    container_name: spendwise-postgres
    environment:
      POSTGRES_USER: spendwise
      POSTGRES_PASSWORD: spendwise
      POSTGRES_DB: spendwise
    ports:
      - "5432:5432"
    volumes:
      - spendwise_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendwise -d spendwise"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: spendwise-api
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://spendwise:spendwise@postgres:5432/spendwise
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - full

volumes:
  spendwise_pgdata:
